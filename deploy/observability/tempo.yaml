###############################################################################
# 智教黔行 · Tempo 单机配置（最小可用版）
# 仅启用 OTLP 接收器与本地存储，足以支撑答辩 demo / 小规模链路演示。
###############################################################################

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # 推到 Prometheus，需要 prometheus 启动参数 --web.enable-remote-write-receiver
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
        # 失败时只重试一次再丢弃，避免拖慢 Tempo
        retry_on_failure:
          enabled: true
          max_retries: 1

usage_report:
  reporting_enabled: false
