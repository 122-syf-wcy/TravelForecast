###############################################################################
# 智教黔行 · Prometheus 抓取配置
# - Spring Boot 服务通过 micrometer-registry-prometheus 暴露 /actuator/prometheus
# - FastAPI 服务通过 prometheus-fastapi-instrumentator 暴露 /metrics
# - 通过 host.docker.internal 访问宿主机服务（与 docker-compose 的 extra_hosts 配合）
###############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: travel-forecast

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: travel-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8888"]
        labels:
          service: travel-gateway

  - job_name: travel-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: travel-backend

  - job_name: travel-ai-backend
    metrics_path: /ai-api/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: travel-ai-backend

  - job_name: travel-miniprogram-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: travel-miniprogram-backend

  - job_name: travel-prediction
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: travel-prediction

  - job_name: travel-digital-human
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          service: travel-digital-human
