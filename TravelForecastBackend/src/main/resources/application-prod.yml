# 应用环境
app:
  env: prod
  frontend-url: ${APP_FRONTEND_URL:https://travel.dongsiwei.com}

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_prediction}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway 默认关闭；若启用请在 pom.xml 同步添加 flyway-core 依赖
  # 并在 src/main/resources/db/migration 下放置版本化迁移脚本。
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  # Spring Boot 3 使用 spring.data.redis 而非 spring.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# OSS配置
oss:
  endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  region: ${OSS_REGION:cn-beijing}
  bucket: ${OSS_BUCKET:smarttourism717}
  domain: ${OSS_DOMAIN:https://smarttourism717.oss-cn-beijing.aliyuncs.com}
  publicDomain: ${OSS_PUBLIC_DOMAIN:https://smarttourism717.oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}

# Python预测服务配置
prediction:
  service:
    url: ${PREDICTION_SERVICE_URL:http://localhost:8001}
    connect-timeout: 10000
    read-timeout: 60000

# JWT配置：生产环境必须通过环境变量注入 JWT_SECRET
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# 日志配置
logging:
  level:
    root: INFO
    com.travel: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/travel-prediction.log
    max-size: 50MB
    max-history: 30
    total-size-cap: 1GB

# 管理端点配置
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

# 跨域配置
cors:
  allowed-origins:
    - https://travel.dongsiwei.com
    - http://travel.dongsiwei.com
    - http://39.97.232.141
    - http://localhost:3000
    - http://localhost:8080
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true
  max-age: 3600

